# CI for the Norvane VPN project (backend + Android app).
#   every push / PR ....... backend tests + Android unit tests + DEBUG APK (downloadable artifact)
#   tag vX.Y.Z or manual .. additionally builds a SIGNED RELEASE AAB (needs the secrets in docs/SIGNING.md)
name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Also build the signed release AAB"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.9"

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run tests (includes the REST API tests, which need fastapi)
        working-directory: backend
        run: python -m unittest discover -s tests -t . -v
      - name: Shell script lint (advisory)
        continue-on-error: true
        working-directory: backend
        run: shellcheck -S warning install.sh uninstall.sh quick-start.sh scripts/*.sh

  android-debug:
    name: Android unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Detect OpenVPN engine
        id: engine
        run: |
          if [ -f android/ics-openvpn/main/build.gradle ] || [ -f android/ics-openvpn/main/build.gradle.kts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### :warning: OpenVPN engine not found"
              echo "This debug APK uses the stub engine: it installs and runs but **cannot connect**."
              echo "Add the engine with \`android/scripts/setup-openvpn-engine.sh\` and commit the submodule."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install SWIG (needed to build the OpenVPN engine)
        if: steps.engine.outputs.present == 'true'
        run: sudo apt-get update && sudo apt-get install -y swig
      - name: Write local.properties
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: |
          printf 'BACKEND_BASE_URL=%s\nBACKEND_API_KEY=%s\n' "$BACKEND_BASE_URL" "$BACKEND_API_KEY" > android/local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Unit tests
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.0.0-debug
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: norvane-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  android-release-aab:
    name: Signed release AAB
    needs: [backend, android-debug]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release   # optional: add required reviewers to this environment in GitHub settings
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Check prerequisites
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
        run: |
          missing=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -z "$missing" ] || { echo "::error::Missing GitHub secrets:$missing (see docs/SIGNING.md)"; exit 1; }
          [ -n "$BACKEND_BASE_URL" ] || { echo "::error::Missing repository variable BACKEND_BASE_URL (Settings > Secrets and variables > Actions > Variables)"; exit 1; }
          [ -f android/ics-openvpn/main/build.gradle ] || [ -f android/ics-openvpn/main/build.gradle.kts ] || {
            echo "::error::OpenVPN engine submodule missing: a release without it could not connect. Run android/scripts/setup-openvpn-engine.sh and commit."; exit 1; }
      - name: Install SWIG
        run: sudo apt-get update && sudo apt-get install -y swig
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Write local.properties
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: |
          printf 'BACKEND_BASE_URL=%s\nBACKEND_API_KEY=%s\n' "$BACKEND_BASE_URL" "$BACKEND_API_KEY" > android/local.properties
      - name: Compute version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-manual.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION_NAME=$v" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Build signed AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:bundleRelease
      - name: Verify the AAB is signed with YOUR key
        run: |
          AAB="$(ls android/app/build/outputs/bundle/release/*.aab | head -n1)"
          echo "Bundle: $AAB"
          jarsigner -verify "$AAB" | tee "$RUNNER_TEMP/verify.txt"
          grep -q "jar verified" "$RUNNER_TEMP/verify.txt" || { echo "::error::AAB signature did not verify"; exit 1; }
          echo "Signing certificate (compare with: keytool -list -v -keystore your.jks):"
          keytool -printcert -jarfile "$AAB" | grep -E "Owner:|SHA256:"
          if keytool -printcert -jarfile "$AAB" | grep -qi "Android Debug"; then echo "::error::AAB is signed with the DEBUG key"; exit 1; fi
      - name: Remove keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/local.properties
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: norvane-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

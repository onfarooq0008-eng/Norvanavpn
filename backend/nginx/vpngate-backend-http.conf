# http{}-level pieces (installed to /etc/nginx/conf.d/vpngate-backend.conf)
limit_req_zone $binary_remote_addr zone=vpngate_api:10m rate=10r/s;
# Privacy: access log WITHOUT client address and without query strings.
log_format vpngate_noip '$time_local "$request_method $uri" $status $body_bytes_sent';
